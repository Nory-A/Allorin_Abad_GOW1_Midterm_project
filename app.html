<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Dictionary Web App</title>

    <script src="script.js" defer></script>
</head>
<body>
     <nav class="navbar" id="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">
                <span class="logo-icon">
                    <i class="bi bi-book"></i>
                </span>
                <span>A.A Dictionary</span>
            </a>
    </nav>

    <section class="home-section">

    <a href="index.html" class="home-button" aria-label="Back to home">
        <i class="bi bi-house-fill"></i>
    </a>

    <div class="home-content">

        <h1 id="main-heading">What's on your mind?</h1>

        <p id="main-description">Type a word below and discover its meaning in seconds.</p>

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input 
                type="text" 
                id="wordInput" 
                placeholder="Try Searching “Dictionary”"
            >

            <button id="searchButton" type="button">
                Find meaning
            </button>

        </div>

        <div id="result"></div>

    </div>

</section>

</body>
</html>
